<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>佐藤優也の日記（裏）</title>
  <link rel="stylesheet" href="../assets/css/common.css">
  <link rel="stylesheet" href="b5fd4017ec98.css">
</head>
<body>
  <!-- Canva No.22「裏日記①」（ドラフト版） -->
  <div class="page page--night">
    <header class="ura-header">
      <h1 class="ura-title">佐藤優也の日記（裏）</h1>
      <p class="ura-lead">
        誰にも言えない。誰にも言わない。言いたくない。<br>
        それでも心のどこかで誰かが見つけてくれる事を期待している俺が居る。<br>
        …なんだかなぁ。
      </p>
    </header>
    <main>
      <div class="ura-panel">
        <!-- 要確認：Canva では「画像」と書かれた仮置き。ここに入れる画像が決まったら差し替えること -->
        <div class="image-placeholder">画像</div>
        <form class="puzzle-form" data-puzzle="ura1" data-wrong="PASSが違います。">
          <label class="puzzle-label" for="answer">PASS</label>
          <input class="puzzle-input" id="answer" type="text" name="answer" autocomplete="off">
          <button class="puzzle-button puzzle-button--glitch" type="submit">②　○○…</button>
          <p class="puzzle-message" data-puzzle-message aria-live="polite"></p>
        </form>
      </div>
    </main>
  </div>
  <script src="../assets/js/puzzle.js"></script>
</body>
</html>

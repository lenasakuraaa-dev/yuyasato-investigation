  <!-- Canva No.36「最終選択」（ドラフト版） -->
  <div class="page page--white">
    <main class="final">
      <h1 class="final-title">正義</h1>
      <p class="final-text">
        朝日太陽は何も知らない。<br>
        自分が誰によって作られたのか。<br>
        自分を作った人間が何をしたのか。<br>
        そして、その人間が誰に殺されたのか。<br>
        あなたは知った。<br>
        真実を伝えることはできる。<br>
        伝えなければ、朝日太陽は<br>
        何も知らないまま生きていける。<br>
        それでもあなたは、真実を伝えますか？
      </p>
      <div class="final-choices">
        <!-- 要確認：Yes 用の YouTube 限定公開動画の URL が未定（決まったら href を差し替える） -->
        <a class="final-choice" href="#">Yes</a>
        <!-- 要確認：No 用の YouTube 限定公開動画の URL が未定（決まったら href を差し替える） -->
        <a class="final-choice" href="#">No</a>
      </div>
      <p class="final-warning">
        ここから先は引き返せません。<br>
        今一度、よく考え<br>
        あなたご自身の正義に則って<br>
        どうか、後悔の無い選択を。
      </p>
    </main>
